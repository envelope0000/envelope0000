<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>商品検索 PRO (v2.6.0)</title>
  
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    :root { --accent: #007aff; --bg: #f2f2f7; }
    body { margin: 0; background: var(--bg); font-family: sans-serif; -webkit-text-size-adjust: 100%; }
    
    header {
      position: sticky; top: 0; z-index: 100; background: #fff;
      padding: calc(10px + env(safe-area-inset-top)) 12px 12px;
      box-shadow: 0 1px 10px rgba(0,0,0,0.1);
    }
    .row { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
    #q { flex: 1; font-size: 20px; padding: 10px; border-radius: 10px; border: 2px solid #d1d1d6; outline: none; appearance: none; }
    
    /* マップエリア：はみ出しを絶対に隠す */
    #inlineMapContainer {
      display: none; background: #333; border-bottom: 1px solid #d1d1d6;
      height: 400px; position: relative; overflow: hidden; touch-action: none;
    }
    
    /* mapWrap: ここで画像を強制的に1920pxの実寸にする */
    #mapWrap { 
      width: 1920px !important; 
      height: 1358px !important; 
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    #mapImg { 
      width: 1920px !important; 
      height: 1358px !important; 
      max-width: none !important; 
      min-width: 1920px !important;
      display: block; 
    }
    
    #mapHighlight {
      position: absolute; border: 10px solid #ff3b30; background: rgba(255,59,48,0.3);
      box-sizing: border-box; z-index: 10;
      box-shadow: 0 0 0 5000px rgba(0,0,0,0.4); /* 周囲を暗くして強調 */
    }
    
    #inlineInfo {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(255,255,255,0.95); padding: 8px 12px; border-top: 1px solid #ddd;
      display: flex; justify-content: center; align-items: center; gap: 15px;
    }
    .info-banchi { font-size: 32px; font-weight: 900; color: var(--accent); }
    .version-info { max-width: 800px; margin: 5px auto; padding: 0 12px; display: flex; justify-content: space-between; font-size: 10px; color: #abb2bf; }
    main { max-width: 800px; margin: 0 auto; padding: 10px; }
    .status-bar { max-width: 800px; margin: 5px auto; font-size: 11px; color: #8e8e93; font-weight: bold; }
  </style>
</head>

<body>
<header>
  <div class="row"><input id="q" type="tel" inputmode="numeric" maxlength="4" placeholder="4桁入力" autocomplete="off" /></div>
  <div id="status" class="status-bar">データ読込中...</div>
</header>

<div id="inlineMapContainer">
  <div id="mapWrap">
    <img id="mapImg" src="map.png" />
    <div id="mapHighlight"></div>
  </div>
  <div id="inlineInfo">
    <div id="resBanchi" class="info-banchi">---</div>
    <div>
      <div id="resArea" style="font-size:12px; color:#666;">エリア</div>
      <div id="resName" style="font-size:15px; font-weight:bold;">商品名</div>
    </div>
  </div>
</div>

<div class="version-info"><span>v2.6.0-force-fix</span><span id="loadTime">Load: --:--:--</span></div>
<main id="out"></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";
let rows = [];
let pzoom = null;

const $q = document.getElementById("q");
const $mapArea = document.getElementById("inlineMapContainer");
const $mapWrap = document.getElementById("mapWrap");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");

function search() {
  const val = $q.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
  $q.value = val;
  if(val.length !== 4) return;
  const hits = rows.filter(r => r.last4 === val);
  if (hits.length === 1) { document.getElementById("out").innerHTML = ""; showMap(hits[0]); }
  $q.blur();
}

function showMap(r) {
  $mapArea.style.display = "block";
  document.getElementById("resArea").textContent = r.area;
  document.getElementById("resName").textContent = r.name;
  document.getElementById("resBanchi").textContent = r.banchi;

  const applyPosition = () => {
    // 1. 赤枠の生座標セット
    $mapHighlight.style.left = r.mapX + "px";
    $mapHighlight.style.top = r.mapY + "px";
    $mapHighlight.style.width = r.mapW + "px";
    $mapHighlight.style.height = r.mapH + "px";
    $mapHighlight.style.display = "block";

    // 2. 窓のサイズと倍率
    const cw = $mapArea.clientWidth;
    const ch = $mapArea.clientHeight;
    const zoomLevel = 0.8; // ご希望の0.8倍

    // 3. ターゲットの中心を計算
    const tx = parseFloat(r.mapX) + (parseFloat(r.mapW) / 2);
    const ty = parseFloat(r.mapY) + (parseFloat(r.mapH) / 2);

    // 4. 強制的に中央へ移動させるCSS値
    const moveX = (cw / 2) - (tx * zoomLevel);
    const moveY = (ch / 2) - (ty * zoomLevel);

    // 5. Transformを直接実行
    $mapWrap.style.transition = "none";
    $mapWrap.style.transform = `translate(${moveX}px, ${moveY}px) scale(${zoomLevel})`;

    // Panzoomの初期化（検索後に手動で動かせるようにする）
    if (!pzoom) {
      pzoom = Panzoom($mapWrap, { contain: false, maxScale: 5 });
    }
  };

  if ($mapImg.complete) applyPosition(); else $mapImg.onload = applyPosition;
}

$q.oninput = () => { if($q.value.length === 4) search(); };
fetch(API_URL + "?t=" + Date.now()).then(r => r.json()).then(j => {
  rows = j.rows.map(x => {
    const c8 = (x.code8||"").toString().padStart(8,"0");
    return {...x, code8:c8, last4:c8.slice(-4)};
  });
  document.getElementById("loadTime").textContent = `Load: ${new Date().toLocaleTimeString()}`;
});
</script>
</body>
</html>
