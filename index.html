<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>商品検索 PRO (v2.7.2)</title>
  
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    :root { --accent: #007aff; --bg: #f2f2f7; }
    body { margin: 0; background: var(--bg); font-family: sans-serif; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    
    header {
      position: sticky; top: 0; z-index: 100; background: #fff;
      padding: calc(10px + env(safe-area-inset-top)) 12px 12px;
      box-shadow: 0 1px 10px rgba(0,0,0,0.1);
    }
    .row { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
    #q { flex: 1; font-size: 20px; padding: 10px; border-radius: 10px; border: 2px solid #d1d1d6; outline: none; appearance: none; }
    
    #mic { font-size: 20px; width: 50px; border: none; background: #e5e5ea; border-radius: 10px; cursor: pointer; }
    #mic.active { background: #ff3b30; color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    /* マップエリア：縦持ちでも横幅を強制フィット */
    #inlineMapContainer {
      display: none; background: #444; border-bottom: 1px solid #d1d1d6;
      height: 400px; position: relative; overflow: hidden; touch-action: none;
    }
    
    /* mapWrap: 親要素の幅(100%)に合わせる */
    #mapWrap { 
      width: 100% !important; 
      height: auto !important;
      transform-origin: 0 0;
    }
    
    /* 画像を「親要素の幅」に100%合わせ、はみ出しを禁止 */
    #mapImg { 
      width: 100% !important; 
      max-width: 100% !important;
      height: auto !important; 
      display: block; 
      pointer-events: none;
    }
    
    #mapHighlight {
      position: absolute; border: 4px solid #ff3b30; background: rgba(255,59,48,0.4);
      box-sizing: border-box; z-index: 10;
      box-shadow: 0 0 15px #ff3b30;
      animation: flash 0.8s infinite alternate;
    }
    @keyframes flash {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.7; transform: scale(1.1); }
    }
    
    /* 下部情報欄の調整 */
    #inlineInfo {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-top: 1px solid #ddd;
      display: flex; align-items: center; gap: 12px;
    }
    
    /* 番地：絶対に改行させない。入り切らない場合は文字を小さくする設定 */
    .info-banchi { 
      font-size: clamp(24px, 8vw, 36px); 
      font-weight: 900; 
      color: var(--accent); 
      white-space: nowrap; 
      flex-shrink: 0; 
    }
    
    /* 品名：改行OK */
    .info-details {
      flex: 1;
      min-width: 0; /* 折り返しを正常に動作させるため */
    }
    .info-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.3;
      word-break: break-all;
    }

    .version-info { max-width: 800px; margin: 5px auto; padding: 0 12px; display: flex; justify-content: space-between; font-size: 10px; color: #abb2bf; }
    main { max-width: 800px; margin: 0 auto; padding: 10px; }
    .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .status-bar { max-width: 800px; margin: 5px auto; font-size: 11px; color: #8e8e93; font-weight: bold; }
  </style>
</head>

<body>
<header>
  <div class="row">
    <input id="q" type="tel" inputmode="numeric" maxlength="4" placeholder="4桁入力" autocomplete="off" />
    <button id="mic">🎤</button>
  </div>
  <div id="status" class="status-bar">データ読込中...</div>
</header>

<div id="inlineMapContainer">
  <div id="mapWrap">
    <img id="mapImg" src="map.png" />
    <div id="mapHighlight"></div>
  </div>
  <div id="inlineInfo">
    <div id="resBanchi" class="info-banchi">---</div>
    <div class="info-details">
      <div id="resArea" style="font-size:11px; color:#666;">エリア</div>
      <div id="resName" class="info-name">商品名</div>
    </div>
  </div>
</div>

<div class="version-info">
  <span>v2.7.2-fit-and-wrap</span>
  <span id="loadTime">Load: --:--:--</span>
</div>

<main id="out"></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";
let rows = [];
let pzoom = null;
let isContinuous = false;

const $q = document.getElementById("q");
const $mic = document.getElementById("mic");
const $status = document.getElementById("status");
const $mapArea = document.getElementById("inlineMapContainer");
const $mapWrap = document.getElementById("mapWrap");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");

/* --- 全選択 --- */
function selectAll(el) { setTimeout(() => { el.setSelectionRange(0, 9999); el.select(); }, 10); }
$q.addEventListener("focus", (e) => selectAll(e.target));
$q.addEventListener("click", (e) => selectAll(e.target));

/* --- 音声認識 --- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  const recognition = new SpeechRec();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.onresult = (e) => {
    const text = e.results[e.results.length-1][0].transcript;
    const v = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
    if(v.length === 4) { $q.value = v; search(); }
  };
  recognition.onend = () => { if(isContinuous) recognition.start(); };
  $mic.onclick = () => {
    isContinuous = !isContinuous;
    if (isContinuous) { recognition.start(); $mic.classList.add("active"); }
    else { recognition.stop(); $mic.classList.remove("active"); }
  };
}

function search() {
  const val = $q.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
  $q.value = val;
  if(val.length !== 4) return;
  const hits = rows.filter(r => r.last4 === val);
  if (hits.length === 1) { 
    document.getElementById("out").innerHTML = ""; 
    showMap(hits[0]); 
    $q.blur();
  } else if (hits.length > 1) {
    $mapArea.style.display = "none";
    document.getElementById("out").innerHTML = hits.map(r => `
      <div class="card" onclick='showMap(${JSON.stringify(r)})'>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-size:14px; font-weight:bold;">${r.name}</div>
          <div style="font-size:24px; font-weight:900; color:#007aff;">${r.banchi}</div>
        </div>
      </div>`).join("");
    $q.blur();
  }
}

function showMap(r) {
  $mapArea.style.display = "block";
  document.getElementById("resArea").textContent = r.area;
  document.getElementById("resName").textContent = r.name;
  document.getElementById("resBanchi").textContent = r.banchi;

  const applyPosition = () => {
    // 画像が画面幅に縮小されている比率を計算
    const ratio = $mapArea.clientWidth / 1920;

    // 赤枠を比率に合わせて配置
    $mapHighlight.style.left = (r.mapX * ratio) + "px";
    $mapHighlight.style.top = (r.mapY * ratio) + "px";
    $mapHighlight.style.width = (r.mapW * ratio) + "px";
    $mapHighlight.style.height = (r.mapH * ratio) + "px";
    $mapHighlight.style.display = "block";

    // 縦持ち時に全体が収まるよう Panzoom を初期化
    if (pzoom) {
      pzoom.reset({ animate: false });
    } else {
      pzoom = Panzoom($mapWrap, { 
        maxScale: 10,
        minScale: 1,
        contain: 'outside'
      });
      $mapWrap.parentElement.addEventListener('wheel', pzoom.zoomWithWheel);
    }
    
    $status.textContent = `${r.last4} の位置を表示`;
  };

  if ($mapImg.complete) applyPosition(); else $mapImg.onload = applyPosition;
}

$q.oninput = () => { if($q.value.length === 4) search(); };

fetch(API_URL + "?t=" + Date.now())
  .then(res => res.json())
  .then(j => {
    rows = j.rows.map(x => {
      const c8 = (x.code8||"").toString().padStart(8,"0");
      return {...x, code8:c8, last4:c8.slice(-4)};
    });
    $status.textContent = `準備完了（${rows.length}件）`;
  });
</script>
</body>
</html>
