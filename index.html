<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>商品コード下4桁検索</title>
  <style>
    :root { --pad: 14px; }
    body { font-family: -apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; background:#f6f7f8; }
    header { padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) var(--pad); background:#fff; position: sticky; top:0; box-shadow: 0 1px 10px rgba(0,0,0,.06); }
    h1 { font-size: 16px; margin: 0 0 10px; font-weight: 800; }
    .row { display:flex; gap:10px; }
    input {
      flex: 1;
      font-size: 22px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      background:#fff;
      outline: none;
    }
    button {
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      background:#fff;
      font-weight: 800;
      white-space: nowrap;
    }
    /* ★説明文を消して上に寄せる */
    main { padding: 6px var(--pad); padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .meta { margin: 10px 2px 0; font-size: 12px; color:#57606a; }

    .card {
      background:#fff; border-radius: 16px; padding: 14px; margin: 12px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }
    .banchi {
      font-size: 48px; font-weight: 900; letter-spacing: .5px; line-height: 1.05;
      margin: 2px 0 10px;
    }
    .area { font-size: 14px; color:#57606a; margin-bottom: 6px; }
    .name { font-size: 16px; font-weight: 800; margin: 8px 0 10px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color:#57606a; }
    .warn { color:#b42318; font-size: 13px; margin-top: 10px; line-height: 1.35; }
    .ok { color:#1a7f37; }

    /* ★1件ヒット時の全画面表示（タップで戻る） */
    .card.fullscreen {
      margin: 0;
      border-radius: 0;
      min-height: calc(100vh - 120px); /* ヘッダー分を除く（ざっくり） */
      display: flex;
      flex-direction: column;
      justify-content: center;

      cursor: pointer;
      user-select: none;
    }
    .card.fullscreen .banchi { font-size: 72px; }
    .card.fullscreen .name { font-size: 20px; }
    .card.fullscreen .area { font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>下4桁で検索（6桁/8桁対応）— 番地を強調</h1>
    <div class="row">
      <input id="q" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             placeholder="例：7137" autocomplete="off" />
      <button id="btn">検索</button>
    </div>
    <div class="meta" id="status">読み込み中…</div>
  </header>

  <main>
    <div id="out"></div>
  </main>

<script>
  // =========================
  // あなたのGAS Web App（JSON API）
  // =========================
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzJGhOght3Ovgt-DCS6tlGqKKgKlUx2v4WGteIjVnNnu_lalSN2gEeLpuzXltFaasiU/exec";

  // 内部状態
  let rows = []; // {area,banchi,name,code8,last4}
  let lastLoadedAt = null;

  let fullscreenMode = false; // ★いま全画面表示中か
  let overwriteMode = false;  // ★「一文字目で上書き」判定用

  const $q = document.getElementById("q");
  const $btn = document.getElementById("btn");
  const $out = document.getElementById("out");
  const $status = document.getElementById("status");

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function normalize4(v) {
    return (v ?? "").toString().replace(/\D/g, "").slice(0, 4);
  }

  function pad8(codeStr) {
    const digits = (codeStr ?? "").toString().trim().replace(/\D/g, "");
    return digits.padStart(8, "0").slice(-8);
  }

  function render(list, query) {
    if (!query || query.length !== 4) {
      fullscreenMode = false;
      $out.innerHTML = "";
      return;
    }

    // ★ 1件だけヒットした場合：全画面表示（タップで戻る）
    if (list.length === 1 && !fullscreenMode) {
      const r = list[0];
      $out.innerHTML = `
        <div class="card fullscreen" id="fsCard" title="タップで戻る">
          <div class="area">${escapeHtml(r.area)}</div>
          <div class="banchi">${escapeHtml(r.banchi)}</div>
          <div class="name">${escapeHtml(r.name)}</div>
          <div class="code">商品コード：${escapeHtml(r.code8)}</div>
        </div>
      `;
      fullscreenMode = true;

      document.getElementById("fsCard").addEventListener("click", () => {
        fullscreenMode = false;
        render(list, query); // 同じ検索語で通常表示に戻す
      });

      return;
    }

    // ここに来たら「通常表示」
    fullscreenMode = false;

    if (!list.length) {
      $out.innerHTML = `<div class="warn">該当なし（下4桁：${escapeHtml(query)}）</div>`;
      return;
    }

    $out.innerHTML = list.map(r => `
      <div class="card">
        <div class="area">${escapeHtml(r.area)}</div>
        <div class="banchi">${escapeHtml(r.banchi)}</div>
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="code">商品コード：${escapeHtml(r.code8)}</div>
      </div>
    `).join("");
  }

  function searchNow() {
    const query = normalize4($q.value);
    $q.value = query;

    if (query.length !== 4) {
      $status.textContent = "下4桁を4文字で入力してください";
      render([], query);
      return;
    }

    const hit = rows.filter(r => (r.last4 ?? "").toString() === query);

    hit.sort((a,b) =>
      (a.area||"").localeCompare(b.area||"","ja") ||
      (a.banchi||"").localeCompare(b.banchi||"","ja") ||
      (a.name||"").localeCompare(b.name||"","ja")
    );

    const loaded = lastLoadedAt ? `（更新: ${lastLoadedAt}）` : "";
    $status.textContent = `下4桁「${query}」：${hit.length}件 ${loaded}`;
    render(hit, query);
  }

  async function load() {
    try {
      $status.textContent = "データ取得中…";
      const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const j = await res.json();
      if (!j || !Array.isArray(j.rows)) throw new Error("JSON形式が想定と違います（{ rows: [...] } が必要）");

      rows = j.rows.map(x => {
        const code8 = pad8(x.code8 ?? x.code ?? "");
        return {
          area: x.area ?? "",
          banchi: x.banchi ?? "",
          name: x.name ?? "",
          code8,
          last4: (x.last4 ?? code8.slice(-4)).toString()
        };
      });

      const now = new Date();
      lastLoadedAt = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;
      $status.innerHTML = `<span class="ok">読み込み完了：${rows.length}件</span>（更新: ${lastLoadedAt}）`;

      if (normalize4($q.value).length === 4) searchNow();
    } catch (e) {
      console.error(e);
      $status.textContent = "読み込み失敗";
      $out.innerHTML = `<div class="warn">
        APIからデータ取得できません。<br/>
        Apps Scriptのデプロイ設定が「全員（匿名ユーザー含む）」になっているか確認してください。<br/>
        <small>${escapeHtml(e.message)}</small>
      </div>`;
    }
  }

  // ★フォーカス時：「次の入力は上書き判定」にする（タップだけでは消さない）
  $q.addEventListener("focus", () => {
    overwriteMode = false;
  });

  // ★入力UX：一文字目を押した瞬間に自動で消える（上書き入力）
  $q.addEventListener("input", () => {
    fullscreenMode = false;

    // 1文字目を入れた瞬間に、前の値を消して今の1文字だけ残す
    // （前回4桁が入っている状態で入力すると value が2文字以上になりやすい）
    if (!overwriteMode && $q.value.length > 1) {
      overwriteMode = true;
      const lastChar = $q.value.slice(-1);
      $q.value = lastChar;
    }

    const v = normalize4($q.value);
    $q.value = v;

    if (v.length === 4) searchNow();
  });

  $btn.addEventListener("click", () => {
    fullscreenMode = false;
    overwriteMode = false;
    searchNow();
  });

  // 起動
  load().then(() => setTimeout(() => $q.focus(), 250));
</script>
</body>
</html>
