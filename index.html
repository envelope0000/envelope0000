<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>商品コード下4桁検索</title>
  
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    :root { --pad: 14px; --gap: 10px; }

    body{
      margin:0;
      background:#f6f7f8;
      font-family:-apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow-x: hidden;
      /* スマホでの不要なバウンススクロールなどを防ぐ */
      overscroll-behavior: none; 
    }
    header{
      position:sticky; top:0; z-index:10;
      background:#fff;
      padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) var(--pad);
      box-shadow:0 1px 10px rgba(0,0,0,.06);
    }
    h1{ font-size:16px; margin:0 0 10px; font-weight:800; }

    .row{ display:flex; gap:var(--gap); align-items:stretch; }
    #q{
      flex: 1 1 auto; min-width:0;
      font-size:22px; padding:12px 14px;
      border-radius:12px; border:1px solid #d0d7de; outline:none;
      background:#fff;
      appearance: none;
    }
    #q:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }

    button{
      flex: 0 0 auto;
      font-size:16px; padding:12px 12px;
      border-radius:12px; border:1px solid #d0d7de;
      background:#fff; font-weight:800; white-space:nowrap;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    #btn{ width:72px; }
    #mic{ width:56px; transition: all 0.2s; font-size: 20px; }
    #mic.listening { 
      background: #ff3b30; border-color: #ff3b30; color: #fff;
      transform: scale(1.1); box-shadow: 0 0 15px rgba(255,59,48,0.4);
    }

    @media (min-width: 768px){ #mic{ display:none !important; } }

    .meta{ margin-top:10px; font-size:12px; color:#57606a; min-height: 1.2em; }
    main{
      padding:6px var(--pad);
      padding-bottom:calc(28px + env(safe-area-inset-bottom));
    }

    .card{
      background:#fff; border-radius:16px; padding:14px; margin:12px 0;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
    }

    .area{ font-size:14px; color:#57606a; }
    .name{ font-size:16px; font-weight:800; margin:8px 0 10px; }
    .code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; color:#57606a; }

    .banchi{ font-size:48px; font-weight:900; margin:6px 0; line-height:1.05; }
    .banchi.tap{ text-decoration: underline; text-underline-offset: 6px; color: #007aff; cursor: pointer; }
    .warn{ color:#b42318; font-size:13px; margin-top:10px; }

    .card.fullscreen{
      margin:0; border-radius:0;
      min-height:calc(100vh - 120px);
      display:flex; flex-direction:column;
      justify-content:flex-start;
      padding-top:16px;
    }
    .card.fullscreen .banchi{ font-size:72px; }

    /* ===== 配置図モーダル（ズーム対応版） ===== */
    #mapModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:9999; }
    #mapBox{
      position:absolute; inset:12px; background:#fff; border-radius:16px;
      overflow:hidden; display:flex; flex-direction:column;
    }
    #mapHeader{
      flex: 0 0 auto; display:flex; justify-content:space-between;
      align-items:center; padding:10px 12px; border-bottom:1px solid #eee; z-index: 2; background:#fff;
    }
    /* ズーム領域のコンテナ */
    #mapBody{
      flex: 1 1 auto; position:relative; overflow:hidden; /* はみ出しを隠す */
      background: #f0f0f0; touch-action: none; /* ブラウザ標準のスクロールを無効化 */
    }
    /* 実際にズーム・移動させる要素 */
    #mapWrap{
      position:absolute; left:0; top:0;
      transform-origin: 0 0; /* 左上基準で変形 */
      cursor: grab;
    }
    #mapImg{ display:block; width:auto; height:auto; max-width:none; /* 画像の幅制限を解除 */ }
    
    #mapHighlight{
      position:absolute; z-index:5; border:4px solid #ff3b30; box-sizing:border-box;
      background: rgba(255,255,255,0.3);
      pointer-events:none; display:none; opacity:0; transition: opacity 140ms ease;
      /* 影は重くなるので一旦削除 */
    }
    #mapHighlight.show{ opacity:1; }

    @media (max-width: 380px){
      :root{ --pad: 12px; --gap: 8px; }
      #q{ font-size:20px; padding:11px 12px; }
      button{ padding:11px 10px; }
      #btn{ width:66px; }
      #mic{ width:52px; }
      #mapHighlight{ border-width:3px; }
    }
  </style>
</head>

<body>
<header>
  <h1>下4桁で検索</h1>
  <div class="row">
    <input id="q" type="tel" inputmode="numeric" maxlength="4"
           placeholder="7137" autocomplete="off" />
    <button id="btn" type="button">検索</button>
    <button id="mic" type="button" aria-label="音声入力">🎤</button>
  </div>
  <div id="status" class="meta">読み込み中…</div>
</header>

<main id="out"></main>

<div id="mapModal" aria-hidden="true">
  <div id="mapBox">
    <div id="mapHeader">
      <div id="mapTitle">配置図</div>
      <button id="mapClose" type="button">閉じる</button>
    </div>
    <div id="mapBody">
      <div id="mapWrap">
        <img id="mapImg" src="" alt="配置図" />
        <div id="mapHighlight"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== 基本設定 ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";
const MAP_IMAGE_URL = "map.png";
// 元画像のサイズ（重要）
const MAP_W = 1920;
const MAP_H = 1358;

let rows = [];
let fullscreenMode = false;

const $q = document.getElementById("q");
const $btn = document.getElementById("btn");
const $mic = document.getElementById("mic");
const $out = document.getElementById("out");
const $status = document.getElementById("status");
const $mapModal = document.getElementById("mapModal");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");
const $mapWrap = document.getElementById("mapWrap");

/* ===== ユーティリティ ===== */
function normalize4(v){
  if(!v) return "";
  let num = v.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
  num = num.replace(/\D/g, "");
  return num.slice(-4);
}
function pad8(v){ return (v||"").replace(/\D/g,"").padStart(8,"0").slice(-8); }

/* ===== 全選択の制御 ===== */
function selectAllText(input) {
  setTimeout(() => { input.setSelectionRange(0, 9999); input.select(); }, 10);
}
$q.addEventListener("focus", (e) => { fullscreenMode = false; selectAllText(e.target); });
$q.addEventListener("click", (e) => { selectAllText(e.target); });

/* ===== 音声認識 ===== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.onstart = () => {
    fullscreenMode = false; $q.value = "";
    $mic.classList.add("listening"); $status.textContent = "音声聞き取り中...";
  };
  recognition.onresult = (event) => {
    const v = normalize4(event.results[0][0].transcript);
    if (v.length > 0) { $q.value = v; search(); } else { $status.textContent = "数字を認識できませんでした"; }
  };
  recognition.onerror = () => { $mic.classList.remove("listening"); };
  recognition.onend = () => { $mic.classList.remove("listening"); };
}
$mic.onclick = () => {
  if (!recognition) return alert("ブラウザが音声入力に対応していません");
  recognition.start();
};

/* ===== 検索・表示 ===== */
function search(){
  const q = normalize4($q.value); $q.value = q;
  if(q.length !== 4) return;
  const hit = rows.filter(r => r.last4 === q);
  $status.textContent = `「${q}」の結果: ${hit.length}件`;
  render(hit, q);
}

function render(list, q){
  if(!list.length){ $out.innerHTML = `<div class="warn">該当なし（${q}）</div>`; return; }
  if(list.length === 1 && !fullscreenMode){
    const r = list[0];
    $out.innerHTML = `
      <div class="card fullscreen" id="fs">
        <div class="area">${r.area}</div>
        <div class="banchi tap" data-info='${JSON.stringify(r)}'>${r.banchi}</div>
        <div class="name">${r.name}</div>
        <div class="code">${r.code8}</div>
        <div style="margin-top:auto; color:#888; font-size:12px; text-align:center; padding:20px;">タップで一覧に戻る</div>
      </div>`;
    fullscreenMode = true;
    document.getElementById("fs").onclick = (e) => {
      if(!e.target.classList.contains('tap')){ fullscreenMode = false; render(list, q); }
    };
  } else {
    fullscreenMode = false;
    $out.innerHTML = list.map(r => `
      <div class="card">
        <div class="area">${r.area}</div>
        <div class="banchi tap" data-info='${JSON.stringify(r)}'>${r.banchi}</div>
        <div class="name">${r.name}</div>
        <div class="code">${r.code8}</div>
      </div>`).join("");
  }
  document.querySelectorAll(".tap").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const r = JSON.parse(el.dataset.info);
      openMap(r.area, r.banchi, {x:+r.mapX, y:+r.mapY, w:+r.mapW, h:+r.mapH});
    };
  });
}

/* ===== ★ズーム機能の実装★ ===== */
let panzoom = null; // ズーム管理用変数を準備

function initPanzoom() {
  // まだ初期化されていなければ実行
  if (!panzoom && window.Panzoom) {
    const elem = document.getElementById('mapWrap');
    panzoom = Panzoom(elem, {
      maxScale: 4, // 最大4倍までズーム
      minScale: 0.8, // 少し縮小も可能に
      contain: 'outside', // 画像が画面外に行き過ぎないように制限
      startScale: 1 // 初期倍率
    });
    // マウスホイールでのズームも有効化（PC用）
    elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);
    
    // ダブルタップでズームイン/アウト
    let lastTap = 0;
    elem.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        // ダブルタップ検出
        e.preventDefault();
        panzoom.zoomIn();
      }
      lastTap = currentTime;
    });
  }
}

/* ===== マップ表示制御 ===== */
function openMap(area, banchi, rect){
  document.getElementById("mapTitle").textContent = `配置図 (${area} ${banchi})`;
  $mapModal.style.display = "block";
  $mapHighlight.classList.remove("show"); // 一旦隠す

  $mapImg.onload = () => {
    // 画像がロードされたらズーム機能を準備
    initPanzoom();
    // 毎回リセットして初期位置に戻す
    if(panzoom) panzoom.reset({ animate: false });

    // 画像の表示サイズを計算（画面幅に合わせる）
    const bodyRect = document.getElementById('mapBody').getBoundingClientRect();
    const scale = bodyRect.width / MAP_W;
    
    // 画像自体の幅を設定
    $mapImg.style.width = (MAP_W * scale) + "px";
    $mapImg.style.height = "auto";

    // ハイライト枠の位置を計算して設定（縮尺に合わせて配置）
    $mapHighlight.style.cssText = `
      display:block;
      left:${rect.x * scale}px;
      top:${rect.y * scale}px;
      width:${rect.w * scale}px;
      height:${rect.h * scale}px;
      opacity:0; /* 最初は透明 */
    `;
    
    // 少し待ってからふわっと表示＆赤枠表示
    setTimeout(()=>{
      if(panzoom) panzoom.reset(); // 位置ズレ防止のため念のためリセット
      $mapHighlight.classList.add("show");
    }, 100);
  };
  // キャッシュ対策でタイムスタンプ付与
  $mapImg.src = MAP_IMAGE_URL + "?t=" + Date.now();
}

// 閉じるボタンの処理
document.getElementById("mapClose").onclick = () => {
  $mapModal.style.display="none";
  $mapHighlight.classList.remove("show");
  // 閉じるときにズームをリセットしておく
  if(panzoom) panzoom.reset({ animate: false });
};

/* ===== 入力監視・データロード ===== */
$q.oninput = () => {
  const v = normalize4($q.value);
  if(v.length === 4) { $q.value = v; search(); $q.blur(); }
};
$btn.onclick = () => { search(); $q.blur(); };

fetch(API_URL + "?t=" + Date.now())
  .then(r => r.json())
  .then(j => {
    rows = j.rows.map(x => {
      const code8 = pad8(x.code8);
      return {...x, code8, last4:code8.slice(-4)};
    });
    $status.textContent = `読み込み完了：${rows.length}件`;
  })
  .catch(() => { $status.textContent = "読み込みエラー"; });
</script>
</body>
</html>
