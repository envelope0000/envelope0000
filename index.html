<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>商品コード検索 PRO (Ultra Stable)</title>
  
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    :root { --accent: #007aff; --bg: #f2f2f7; }
    body { margin: 0; background: var(--bg); font-family: sans-serif; }
    
    header {
      position: sticky; top: 0; z-index: 100; background: #fff;
      padding: calc(12px + env(safe-area-inset-top)) 12px 12px;
      box-shadow: 0 1px 10px rgba(0,0,0,0.1);
    }
    .row { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
    #q { flex: 1; font-size: 22px; padding: 12px; border-radius: 12px; border: 2px solid #d1d1d6; outline: none; }
    #mic { font-size: 22px; width: 60px; border: none; background: #e5e5ea; border-radius: 12px; cursor: pointer; }
    #mic.active { background: #ff3b30; color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    /* ===== マップエリア（背景を白に戻し、視認性向上） ===== */
    #inlineMapContainer {
      display: none; background: #fff; border-bottom: 1px solid #d1d1d6;
      height: 450px; position: relative; overflow: hidden; touch-action: none;
    }
    #mapWrap { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #mapImg { display: block; user-select: none; width: 1920px !important; height: auto !important; }
    
    #mapHighlight {
      position: absolute; border: 6px solid #ff3b30; background: rgba(255,59,48,0.3);
      box-sizing: border-box; z-index: 10;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.2); /* 周りを少し暗くして強調 */
    }
    
    #inlineInfo {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(255,255,255,0.9); padding: 12px; border-top: 1px solid #ddd;
      display: flex; justify-content: center; align-items: center; gap: 20px;
    }
    .info-banchi { font-size: 42px; font-weight: 900; color: var(--accent); }

    main { max-width: 800px; margin: 0 auto; padding: 12px; }
    .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
    .card-banchi { font-size: 28px; font-weight: 900; color: var(--accent); }
  </style>
</head>

<body>
<header>
  <div class="row">
    <input id="q" type="tel" inputmode="numeric" maxlength="4" placeholder="下4桁入力" autocomplete="off" />
    <button id="mic">🎤</button>
  </div>
  <div id="status" class="meta" style="max-width:800px; margin:8px auto 0; font-size:12px; color:#8e8e93;">読み込み中...</div>
</header>

<div id="inlineMapContainer">
  <div id="mapWrap">
    <img id="mapImg" src="map.png" /> <div id="mapHighlight"></div>
  </div>
  <div id="inlineInfo">
    <div id="resBanchi" class="info-banchi">---</div>
    <div>
      <div id="resArea" style="font-size:14px; color:#666;">エリア</div>
      <div id="resName" style="font-size:18px; font-weight:bold;">商品名</div>
    </div>
  </div>
</div>

<main id="out"></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";

let rows = [];
let pzoom = null;
let isContinuous = false;

const $q = document.getElementById("q");
const $mic = document.getElementById("mic");
const $out = document.getElementById("out");
const $status = document.getElementById("status");
const $mapArea = document.getElementById("inlineMapContainer");
const $mapWrap = document.getElementById("mapWrap");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");

function selectAll(el) { setTimeout(() => { el.setSelectionRange(0, 9999); el.select(); }, 10); }
$q.addEventListener("focus", (e) => selectAll(e.target));
$q.addEventListener("click", (e) => selectAll(e.target));

/* --- 音声認識 --- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  const recognition = new SpeechRec();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.onresult = (e) => {
    const text = e.results[e.results.length-1][0].transcript;
    const v = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
    if(v.length === 4) { $q.value = v; search(); }
  };
  recognition.onend = () => { if(isContinuous) recognition.start(); };
  $mic.onclick = () => {
    isContinuous = !isContinuous;
    if (isContinuous) { recognition.start(); $mic.classList.add("active"); }
    else { recognition.stop(); $mic.classList.remove("active"); }
  };
}

/* --- 検索 --- */
function search() {
  const val = $q.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
  $q.value = val;
  if(val.length !== 4) return;
  const hits = rows.filter(r => r.last4 === val);
  if (hits.length === 1) { $out.innerHTML = ""; showMap(hits[0]); }
  else if (hits.length > 1) {
    $mapArea.style.display = "none";
    $out.innerHTML = hits.map(r => `
      <div class="card" onclick='showMap(${JSON.stringify(r)})'>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div><div style="color:#666; font-size:12px;">${r.area}</div><div style="font-size:16px; font-weight:bold;">${r.name}</div></div>
          <div class="card-banchi">${r.banchi}</div>
        </div>
      </div>`).join("");
  } else {
    $mapArea.style.display = "none";
    $out.innerHTML = `<div class="warn">「${val}」は見つかりません</div>`;
  }
  $q.blur();
}

/* --- マップ表示（安定化版） --- */
function showMap(r) {
  $mapArea.style.display = "block";
  document.getElementById("resArea").textContent = r.area;
  document.getElementById("resName").textContent = r.name;
  document.getElementById("resBanchi").textContent = r.banchi;

  if (!pzoom) {
    pzoom = Panzoom($mapWrap, { maxScale: 8, minScale: 0.1, contain: 'outside' });
    $mapWrap.parentElement.addEventListener('wheel', pzoom.zoomWithWheel);
  }

  const applyPosition = () => {
    $mapHighlight.style.left = r.mapX + "px";
    $mapHighlight.style.top = r.mapY + "px";
    $mapHighlight.style.width = r.mapW + "px";
    $mapHighlight.style.height = r.mapH + "px";
    $mapHighlight.style.display = "block";

    const cw = $mapArea.clientWidth;
    const ch = $mapArea.clientHeight;
    
    // PC/スマホ共通のズーム倍率
    const zoomLevel = cw > 800 ? 1.5 : 2.5;

    // 数値として確実に計算
    const mx = parseFloat(r.mapX);
    const my = parseFloat(r.mapY);
    const mw = parseFloat(r.mapW);
    const mh = parseFloat(r.mapH);

    const targetX = (cw / 2) - (mx + mw / 2) * zoomLevel;
    const targetY = (ch / 2) - (my + mh / 2) * zoomLevel;

    pzoom.zoom(zoomLevel, { animate: false });
    pzoom.pan(targetX, targetY, { animate: false });
  };

  // 画像が読み込まれるのを待ってから配置
  if ($mapImg.complete && $mapImg.naturalWidth !== 0) {
    applyPosition();
  } else {
    $mapImg.onload = applyPosition;
  }
}

$q.oninput = () => { if($q.value.length === 4) search(); };

fetch(API_URL + "?t=" + Date.now())
  .then(r => r.json())
  .then(j => {
    rows = j.rows.map(x => {
      const c8 = (x.code8||"").toString().padStart(8,"0");
      return {...x, code8:c8, last4:c8.slice(-4)};
    });
    $status.textContent = `準備完了（${rows.length}件）`;
  });
</script>
</body>
</html>
