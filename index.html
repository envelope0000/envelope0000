<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>商品コード下4桁検索</title>

  <style>
    :root { --pad: 14px; }

    body {
      margin: 0;
      background: #f6f7f8;
      font-family: -apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      background: #fff;
      padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) var(--pad);
      box-shadow: 0 1px 10px rgba(0,0,0,.06);
      z-index: 10;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      font-size: 22px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      outline: none;
      background: #fff;
    }

    button {
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      background: #fff;
      font-weight: 800;
      white-space: nowrap;
    }

    .meta {
      margin-top: 10px;
      font-size: 12px;
      color: #57606a;
    }

    main {
      padding: 6px var(--pad);
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    /* ===== 結果カード ===== */

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }

    .area {
      font-size: 14px;
      color: #57606a;
      margin-bottom: 6px;
    }

    .banchi {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: .5px;
      line-height: 1.05;
      margin: 2px 0 10px;
    }

    .name {
      font-size: 16px;
      font-weight: 800;
      margin: 8px 0 10px;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #57606a;
    }

    .warn {
      color: #b42318;
      font-size: 13px;
      margin-top: 10px;
    }

    .ok {
      color: #1a7f37;
    }

    /* ===== 1件ヒット時（全画面・上詰め） ===== */

    .card.fullscreen {
      margin: 0;
      border-radius: 0;
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* ← 上詰め */
      padding-top: 16px;

      cursor: pointer;
      user-select: none;
    }

    .card.fullscreen .banchi { font-size: 72px; }
    .card.fullscreen .name   { font-size: 20px; }
    .card.fullscreen .area   { font-size: 16px; }
  </style>
</head>

<body>
  <header>
    <h1>下4桁で検索（6桁 / 8桁対応）</h1>
    <div class="row">
      <input id="q"
             type="tel"
             inputmode="numeric"
             pattern="[0-9]*"
             maxlength="4"
             placeholder="例：7137"
             autocomplete="off" />
      <button id="btn">検索</button>
    </div>
    <div class="meta" id="status">読み込み中…</div>
  </header>

  <main>
    <div id="out"></div>
  </main>

<script>
  /* =============================
     GAS JSON API
  ============================= */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzJGhOght3Ovgt-DCS6tlGqKKgKlUx2v4WGteIjVnNnu_lalSN2gEeLpuzXltFaasiU/exec";

  let rows = [];
  let lastLoadedAt = null;
  let fullscreenMode = false;

  const $q = document.getElementById("q");
  const $btn = document.getElementById("btn");
  const $out = document.getElementById("out");
  const $status = document.getElementById("status");

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function normalize4(v) {
    return (v ?? "").toString().replace(/\D/g, "").slice(0, 4);
  }

  function pad8(codeStr) {
    const d = (codeStr ?? "").toString().replace(/\D/g, "");
    return d.padStart(8, "0").slice(-8);
  }

  /* =============================
     表示
  ============================= */
  function render(list, query) {
    if (!query || query.length !== 4) {
      fullscreenMode = false;
      $out.innerHTML = "";
      return;
    }

    // 1件ヒット → 全画面（上詰め）
    if (list.length === 1 && !fullscreenMode) {
      const r = list[0];
      $out.innerHTML = `
        <div class="card fullscreen" id="fsCard">
          <div class="area">${escapeHtml(r.area)}</div>
          <div class="banchi">${escapeHtml(r.banchi)}</div>
          <div class="name">${escapeHtml(r.name)}</div>
          <div class="code">商品コード：${escapeHtml(r.code8)}</div>
        </div>
      `;
      fullscreenMode = true;

      document.getElementById("fsCard").addEventListener("click", () => {
        fullscreenMode = false;
        render(list, query);
      });
      return;
    }

    fullscreenMode = false;

    if (!list.length) {
      $out.innerHTML = `<div class="warn">該当なし（${escapeHtml(query)}）</div>`;
      return;
    }

    $out.innerHTML = list.map(r => `
      <div class="card">
        <div class="area">${escapeHtml(r.area)}</div>
        <div class="banchi">${escapeHtml(r.banchi)}</div>
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="code">商品コード：${escapeHtml(r.code8)}</div>
      </div>
    `).join("");
  }

  /* =============================
     検索
  ============================= */
  function searchNow() {
    const q = normalize4($q.value);
    $q.value = q;

    if (q.length !== 4) {
      $status.textContent = "下4桁を入力してください";
      render([], q);
      return;
    }

    const hit = rows.filter(r => r.last4 === q);
    const loaded = lastLoadedAt ? `（更新 ${lastLoadedAt}）` : "";
    $status.textContent = `「${q}」：${hit.length}件 ${loaded}`;
    render(hit, q);
  }

  /* =============================
     データ取得
  ============================= */
  async function load() {
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
      const j = await res.json();

      rows = j.rows.map(x => {
        const code8 = pad8(x.code8 ?? "");
        return {
          area: x.area ?? "",
          banchi: x.banchi ?? "",
          name: x.name ?? "",
          code8,
          last4: code8.slice(-4)
        };
      });

      const now = new Date();
      lastLoadedAt = `${now.getHours()}:${now.getMinutes().toString().padStart(2,"0")}`;
      $status.innerHTML = `<span class="ok">読み込み完了：${rows.length}件</span>`;

    } catch (e) {
      $status.textContent = "読み込み失敗";
    }
  }

  /* =============================
     入力UX（安定版）
  ============================= */
  function selectAllLater() {
    setTimeout(() => {
      try {
        $q.setSelectionRange(0, $q.value.length);
      } catch {}
    }, 0);
  }

  $q.addEventListener("focus", selectAllLater);
  $q.addEventListener("click", selectAllLater);
  $q.addEventListener("touchstart", selectAllLater, { passive: true });

  $q.addEventListener("input", () => {
  fullscreenMode = false;
  const v = normalize4($q.value);
  $q.value = v;

  if (v.length === 4) {
    searchNow();
    $q.blur();   // ★ ここを追加：キーボードを閉じる
  }
});

  $btn.addEventListener("click", searchNow);

  load().then(() => setTimeout(() => $q.focus(), 300));
</script>
</body>
</html>
