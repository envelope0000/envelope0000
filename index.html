<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>商品コード下4桁検索</title>

<style>
:root { --pad: 14px; }

body{
  margin:0;
  background:#f6f7f8;
  font-family:-apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
header{
  position:sticky; top:0; z-index:10;
  background:#fff;
  padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) var(--pad);
  box-shadow:0 1px 10px rgba(0,0,0,.06);
}
h1{ font-size:16px; margin:0 0 10px; font-weight:800; }
.row{ display:flex; gap:10px; }
input{
  flex:1; font-size:22px; padding:12px 14px;
  border-radius:12px; border:1px solid #d0d7de; outline:none;
  background:#fff;
}
button{
  font-size:16px; padding:12px 14px;
  border-radius:12px; border:1px solid #d0d7de;
  background:#fff; font-weight:800; white-space:nowrap;
}
.meta{ margin-top:10px; font-size:12px; color:#57606a; line-height:1.35; }
main{
  padding:6px var(--pad);
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}

.card{
  background:#fff; border-radius:16px; padding:14px; margin:12px 0;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}
.area{ font-size:14px; color:#57606a; margin-bottom:6px; }
.name{ font-size:16px; font-weight:800; margin:8px 0 10px; }
.code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; color:#57606a; }

.banchi{
  font-size:48px; font-weight:900; letter-spacing:.5px; line-height:1.05;
  margin:2px 0 10px;
}
.banchi.tap{
  text-decoration: underline;
  text-underline-offset: 6px;
}

.warn{ color:#b42318; font-size:13px; margin-top:10px; }
.ok{ color:#1a7f37; }

.card.fullscreen{
  margin:0;
  border-radius:0;
  min-height:calc(100vh - 120px);
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding-top:16px;
  cursor:pointer;
  user-select:none;
}
.card.fullscreen .banchi{ font-size:72px; }
.card.fullscreen .name{ font-size:20px; }
.card.fullscreen .area{ font-size:16px; }

/* ===== 配置図モーダル ===== */
#mapModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:9999;
}
#mapBox{
  position:absolute;
  inset:12px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
#mapHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid #eee;
}
#mapTitle{ font-weight:900; }
#mapClose{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:6px 10px;
  font-weight:900;
}
#mapBody{
  height:calc(100% - 44px);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  background:#fff;
}

/* 画像+枠（最終おすすめ：内側描画＋白背景） */
#mapWrap{ position:relative; max-width:100%; }
#mapImg{
  width:100%;
  height:auto;
  display:block;
  max-width:100%;
  position:relative;
  z-index:1;
}
#mapHighlight{
  position:absolute;
  z-index:5;

  border:4px solid #ff3b30;
  box-sizing:border-box;
  border-radius:6px;

  background: rgba(255,255,255,0.55);
  box-shadow: 0 0 0 9999px rgba(0,0,0,.08);

  pointer-events:none;
  display:none;

  /* ふわっと表示（控えめ） */
  opacity:0;
  transition: opacity 140ms ease;
}
#mapHighlight.show{ opacity:1; }
</style>
</head>

<body>
<header>
  <h1>下4桁で検索</h1>
  <div class="row">
    <input id="q" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
           placeholder="例：7137" autocomplete="off" />
    <button id="btn" type="button">検索</button>
  </div>
  <div class="meta" id="status">読み込み中…</div>
</header>

<main>
  <div id="out"></div>
</main>

<!-- 配置図モーダル -->
<div id="mapModal" aria-hidden="true">
  <div id="mapBox">
    <div id="mapHeader">
      <div id="mapTitle">配置図</div>
      <button id="mapClose" type="button">閉じる</button>
    </div>
    <div id="mapBody">
      <div id="mapWrap">
        <img id="mapImg" src="" alt="配置図" />
        <div id="mapHighlight"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================
   設定
========================= */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";

// 配置図（index.htmlと同じ階層に map.png）
const MAP_IMAGE_URL = "map.png";
const MAP_W = 1920;
const MAP_H = 1358;

// 見た目の最終微調整（まずは2。環境で気になるなら1〜3で調整）
const FIX = 2;

/* =========================
   状態・DOM
========================= */
let rows = [];
let lastLoadedAt = null;
let fullscreenMode = false;

const $q = document.getElementById("q");
const $btn = document.getElementById("btn");
const $out = document.getElementById("out");
const $status = document.getElementById("status");

const $mapModal = document.getElementById("mapModal");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");
const $mapTitle = document.getElementById("mapTitle");
const $mapClose = document.getElementById("mapClose");

/* =========================
   ユーティリティ
========================= */
function escapeHtml(s){
  return (s ?? "").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function normalize4(v){
  return (v ?? "").toString().replace(/\D/g, "").slice(0, 4);
}
function pad8(codeStr){
  const d = (codeStr ?? "").toString().replace(/\D/g, "");
  return d.padStart(8,"0").slice(-8);
}

/* =========================
   配置図モーダル
========================= */
function closeMap(){
  $mapModal.style.display = "none";
  $mapModal.setAttribute("aria-hidden","true");
  $mapImg.src = "";
  $mapHighlight.classList.remove("show");
  $mapHighlight.style.display = "none";
}
$mapClose.addEventListener("click", closeMap);
$mapModal.addEventListener("click", (e)=>{ if(e.target === $mapModal) closeMap(); });

function openMap(area, banchi, rect){
  $mapTitle.textContent = `配置図（${area} / ${banchi}）`;
  $mapModal.style.display = "block";
  $mapModal.setAttribute("aria-hidden","false");

  $mapHighlight.classList.remove("show");
  $mapHighlight.style.display = "none";

  const draw = () => {
    const imgRect = $mapImg.getBoundingClientRect();
    const imgW = imgRect.width;
    const imgH = imgRect.height;

    if (!imgW || !imgH) return;
    if (![rect.x,rect.y,rect.w,rect.h].every(n => Number.isFinite(n) && n > 0)) return;

    const sx = imgW / MAP_W;
    const sy = imgH / MAP_H;

    const left   = rect.x * sx + FIX;
    const top    = rect.y * sy + FIX;
    const width  = rect.w * sx - FIX*2;
    const height = rect.h * sy - FIX*2;

    $mapHighlight.style.left   = left + "px";
    $mapHighlight.style.top    = top + "px";
    $mapHighlight.style.width  = Math.max(0, width) + "px";
    $mapHighlight.style.height = Math.max(0, height) + "px";

    $mapHighlight.style.display = "block";
    requestAnimationFrame(() => $mapHighlight.classList.add("show"));
  };

  // iPhone Safari対策：onloadで確実に高さが出てから描画
  $mapImg.onload = () => requestAnimationFrame(draw);
  $mapImg.src = MAP_IMAGE_URL + "?t=" + Date.now();
}

/* =========================
   番地タップ紐付け
========================= */
function wireBanchiClicks(){
  $out.querySelectorAll(".banchi.tap[data-mapx]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();

      const rect = {
        x: Number(el.dataset.mapx),
        y: Number(el.dataset.mapy),
        w: Number(el.dataset.mapw),
        h: Number(el.dataset.maph),
      };

      openMap(el.dataset.area || "", el.dataset.banchi || "", rect);
    });
  });
}

/* =========================
   表示
========================= */
function render(list, query){
  if (!query || query.length !== 4) {
    fullscreenMode = false;
    $out.innerHTML = "";
    return;
  }

  // 1件ヒット → 全画面（タップで戻る）
  if (list.length === 1 && !fullscreenMode) {
    const r = list[0];
    $out.innerHTML = `
      <div class="card fullscreen" id="fsCard" title="タップで戻る">
        <div class="area">${escapeHtml(r.area)}</div>

        <div class="banchi tap"
          data-area="${escapeHtml(r.area)}"
          data-banchi="${escapeHtml(r.banchi)}"
          data-mapx="${r.mapX}"
          data-mapy="${r.mapY}"
          data-mapw="${r.mapW}"
          data-maph="${r.mapH}">
          ${escapeHtml(r.banchi)}
        </div>

        <div class="name">${escapeHtml(r.name)}</div>
        <div class="code">商品コード：${escapeHtml(r.code8)}</div>
      </div>
    `;
    fullscreenMode = true;

    document.getElementById("fsCard").addEventListener("click", () => {
      fullscreenMode = false;
      render(list, query);
    });

    wireBanchiClicks();
    return;
  }

  fullscreenMode = false;

  if (!list.length) {
    $out.innerHTML = `<div class="warn">該当なし（${escapeHtml(query)}）</div>`;
    return;
  }

  $out.innerHTML = list.map(r => `
    <div class="card">
      <div class="area">${escapeHtml(r.area)}</div>

      <div class="banchi tap"
        data-area="${escapeHtml(r.area)}"
        data-banchi="${escapeHtml(r.banchi)}"
        data-mapx="${r.mapX}"
        data-mapy="${r.mapY}"
        data-mapw="${r.mapW}"
        data-maph="${r.mapH}">
        ${escapeHtml(r.banchi)}
      </div>

      <div class="name">${escapeHtml(r.name)}</div>
      <div class="code">商品コード：${escapeHtml(r.code8)}</div>
    </div>
  `).join("");

  wireBanchiClicks();
}

/* =========================
   検索
========================= */
function searchNow(){
  const q = normalize4($q.value);
  $q.value = q;

  if (q.length !== 4) {
    $status.textContent = "下4桁を入力してください";
    render([], q);
    return;
  }

  const hit = rows.filter(r => r.last4 === q);

  const loaded = lastLoadedAt ? `（更新 ${lastLoadedAt}）` : "";
  $status.textContent = `「${q}」：${hit.length}件 ${loaded}`;

  render(hit, q);
}

/* =========================
   入力UX（安定：全選択→上書き）
========================= */
function selectAllLater(){
  setTimeout(() => { try { $q.setSelectionRange(0, $q.value.length); } catch {} }, 0);
}
$q.addEventListener("focus", () => { fullscreenMode=false; selectAllLater(); });
$q.addEventListener("click", () => { fullscreenMode=false; selectAllLater(); });
$q.addEventListener("touchstart", () => { fullscreenMode=false; selectAllLater(); }, { passive:true });

// 4桁で検索＆キーボード閉じる
$q.addEventListener("input", () => {
  fullscreenMode = false;
  const v = normalize4($q.value);
  $q.value = v;
  if (v.length === 4) {
    searchNow();
    $q.blur();
  }
});
$btn.addEventListener("click", () => {
  fullscreenMode = false;
  searchNow();
  $q.blur();
});

/* =========================
   データ取得
========================= */
async function load(){
  try{
    $status.textContent = "データ取得中…";

    const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
    const j = await res.json();
    if (!j || !Array.isArray(j.rows)) throw new Error("JSON rowsがない");

    rows = j.rows.map(x => {
      const y = {};
      for (const k in x) y[String(k).trim()] = x[k];

      const code8 = pad8(y.code8 ?? y.code ?? y["商品コード"] ?? "");
      return {
        area:   y.area ?? y["エリア"] ?? "",
        banchi: y.banchi ?? y["番地"] ?? "",
        name:   y.name ?? y["商品名"] ?? "",
        code8,
        last4: (y.last4 ?? code8.slice(-4)).toString(),

        mapX: Number(y.mapX ?? 0),
        mapY: Number(y.mapY ?? 0),
        mapW: Number(y.mapW ?? 0),
        mapH: Number(y.mapH ?? 0),
      };
    });

    const now = new Date();
    lastLoadedAt = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;

    $status.textContent = `読み込み完了：${rows.length}件（更新 ${lastLoadedAt}）`;

  } catch(e){
    $status.textContent = "読み込み失敗（API設定を確認してください）";
    $out.innerHTML = `<div class="warn">API取得に失敗しました。</div>`;
  }
}

load().then(() => setTimeout(() => $q.focus(), 300));
</script>
</body>
</html>
