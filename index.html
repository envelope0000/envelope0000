<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>商品検索 PRO (v2.9.1)</title>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <style>
    :root { --accent: #007aff; --bg: #f2f2f7; }
    
    /* 画面全体を「絶対に」スクロールさせない設定 */
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed;
    }
    
    body { 
      background: #333; font-family: sans-serif; 
      display: flex; flex-direction: column; 
    }
    
    /* ヘッダー：URLバーの下に確実に配置 */
    header { 
      flex-shrink: 0; background: #fff; 
      padding-top: calc(12px + env(safe-area-inset-top)); /* Safariの上の隙間 */
      padding-left: 12px; padding-right: 12px; padding-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 100;
    }
    .row { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
    #q { flex: 1; font-size: 20px; padding: 12px; border-radius: 10px; border: 2px solid #d1d1d6; outline: none; appearance: none; }
    #mic { font-size: 20px; width: 55px; border: none; background: #e5e5ea; border-radius: 10px; cursor: pointer; }
    #mic.active { background: #ff3b30; color: #fff; animation: pulse 1.5s infinite; }

    /* マップエリア：ヘッダーとフッターの隙間を埋める */
    #inlineMapContainer { 
      display: none; flex: 1; position: relative; overflow: hidden; touch-action: none;
      background: #444; width: 100%;
    }
    #mapWrap { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #mapImg { width: 100% !important; height: auto !important; display: block; }
    #mapHighlight { position: absolute; border: 4px solid #ff3b30; background: rgba(255,59,48,0.4); box-sizing: border-box; z-index: 10; box-shadow: 0 0 15px #ff3b30; animation: flash 0.8s infinite alternate; }
    
    /* リスト（複数ヒット時）：ここも隙間を埋める */
    main { 
      display: block; flex: 1; overflow-y: auto; padding: 10px; background: var(--bg);
    }
    .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 8px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    /* フッター：画面下端に固定 */
    footer {
      flex-shrink: 0; background: #fff; border-top: 1px solid #ccc; z-index: 110;
      padding-bottom: env(safe-area-inset-bottom); /* 下のホームバー回避 */
    }
    #inlineInfo { padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
    .info-banchi { font-size: 42px; font-weight: 900; color: var(--accent); line-height: 1; }
    .info-name { font-size: 15px; font-weight: bold; line-height: 1.2; color: #000; word-break: break-all; }

    .meta-info { 
      padding: 0 12px 4px; display: flex; justify-content: space-between; 
      font-size: 10px; color: #999; border-top: 1px solid #f0f0f0;
    }
    
    @keyframes flash { from { opacity: 1; transform: scale(1); } to { opacity: 0.7; transform: scale(1.1); } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<header>
  <div class="row">
    <input id="q" type="tel" inputmode="numeric" maxlength="4" placeholder="4桁入力" autocomplete="off" />
    <button id="mic">🎤</button>
  </div>
</header>

<div id="inlineMapContainer">
  <div id="mapWrap"><img id="mapImg" src="map.png" /><div id="mapHighlight"></div></div>
</div>

<main id="out"></main>

<footer>
  <div id="inlineInfo" style="display: none;">
    <div id="resBanchi" class="info-banchi">--</div>
    <div style="flex:1; min-width:0;">
      <div id="resArea" style="font-size:11px; color:#666; margin-bottom:2px;">エリア</div>
      <div id="resName" class="info-name">商品名</div>
    </div>
  </div>
  <div class="meta-info">
    <span id="status">読込中...</span>
    <span>v2.9.1-safe-fixed</span>
  </div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwk_axbzbOKfxcISj6EcwmDGdA334VO3ehSTsMk3yamQPlXknZmH2zrkoJqRLH6tRAT/exec";
let rows = []; let pzoom = null; let isContinuous = false; let recognition = null;

const $q = document.getElementById("q");
const $mic = document.getElementById("mic");
const $out = document.getElementById("out");
const $status = document.getElementById("status");
const $mapArea = document.getElementById("inlineMapContainer");
const $infoArea = document.getElementById("inlineInfo");
const $mapWrap = document.getElementById("mapWrap");
const $mapImg = document.getElementById("mapImg");
const $mapHighlight = document.getElementById("mapHighlight");

/* --- 音声認識 --- */
function initMic() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return;
  recognition = new SpeechRec(); recognition.lang = 'ja-JP'; recognition.continuous = true;
  recognition.onresult = (e) => {
    const text = e.results[e.results.length-1][0].transcript;
    const v = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
    if(v.length === 4) { $q.value = v; search(); }
  };
  recognition.onend = () => { if(isContinuous) recognition.start(); };
}

$mic.onclick = () => { if (!recognition) initMic(); isContinuous = !isContinuous; if (isContinuous) { recognition.start(); $mic.classList.add("active"); } else { recognition.stop(); $mic.classList.remove("active"); } };

/* --- 検索 --- */
function search() {
  const val = $q.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\D/g,"").slice(-4);
  $q.value = val; if(val.length !== 4) return;
  const hits = rows.filter(r => r.last4 === val);
  if (hits.length === 1) { 
    $out.style.display = "none";
    showMap(hits[0]); 
    $q.blur(); 
  } else if (hits.length > 1) {
    $mapArea.style.display = "none"; $infoArea.style.display = "none";
    $out.style.display = "block";
    $out.innerHTML = hits.map(r => `<div class="card" onclick='showMap(${JSON.stringify(r)})'><div style="display:flex; justify-content:space-between; align-items:center;"><div style="font-size:16px; font-weight:bold;">${r.name}</div><div style="font-size:28px; font-weight:900; color:#007aff;">${r.banchi}</div></div></div>`).join("");
  }
}

/* --- 表示 --- */
function showMap(r) {
  $out.style.display = "none";
  $mapArea.style.display = "block"; $infoArea.style.display = "flex";
  document.getElementById("resArea").textContent = r.area; 
  document.getElementById("resName").textContent = r.name; 
  document.getElementById("resBanchi").textContent = r.banchi;

  const applyPosition = () => {
    const screenW = window.innerWidth;
    $mapWrap.style.width = screenW + "px";
    const ratio = screenW / 1920;
    
    $mapHighlight.style.left = (r.mapX * ratio) + "px";
    $mapHighlight.style.top = (r.mapY * ratio) + "px";
    $mapHighlight.style.width = (r.mapW * ratio) + "px";
    $mapHighlight.style.height = (r.mapH * ratio) + "px";
    $mapHighlight.style.display = "block";

    if (pzoom) pzoom.destroy();
    pzoom = Panzoom($mapWrap, { maxScale: 8, minScale: 1, contain: 'outside', startX: 0, startY: 0 });
    
    // 赤枠が画面中央にくるよう自動オフセット
    const highlightY = r.mapY * ratio;
    const containerH = $mapArea.clientHeight;
    const offsetY = Math.max(0, highlightY - (containerH / 3)); 
    $mapWrap.style.transform = `scale(1) translate(0px, -${offsetY}px)`;
  };
  if ($mapImg.complete) setTimeout(applyPosition, 50); else $mapImg.onload = applyPosition;
}

$q.addEventListener("focus", (e) => { setTimeout(() => { e.target.select(); }, 10); });
$q.oninput = () => { if($q.value.length === 4) search(); };

fetch(API_URL).then(res => res.json()).then(j => {
  rows = j.rows.map(x => ({...x, last4:(x.code8||"").toString().padStart(8,"0").slice(-4)}));
  $status.textContent = `準備完了（${rows.length}件）`;
});
</script>
</body>
</html>
